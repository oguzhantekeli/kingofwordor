name: CI

on:
  push: { branches: [master, main] }
  pull_request:

env:
  NODE_VERSION: '24.18.1'

jobs:
  web:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm approve-scripts ffmpeg-static

      - name: Build dictionary from source
        run: npm run build:dict

      - name: Dictionary is reproducible
        run: |
          sha256sum public/dict/en.kowd > /tmp/dict.sha
          npm run build:dict
          sha256sum -c /tmp/dict.sha

      - name: Build assets from source
        run: |
          npm run build:assets
          npm run build:sprites
          npm run build:music
          npm run build:fonts

      - name: Asset integrity
        run: node tools/verify-assets.mjs

      - run: npm run lint
      - run: npx tsc -b --force
      - run: npx vitest run --coverage
      - run: npm run build

      - name: No source maps in the bundle
        run: |
          if find dist -name '*.map' | grep -q .; then
            echo "source maps must not ship (audit §3.10)"; exit 1
          fi

      - name: Production dependencies have no advisories
        run: npm audit --omit=dev --audit-level=low

      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist, retention-days: 7 }

  android:
    name: android debug build
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # AdMob's Gradle module requires JavaVersion.VERSION_21
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm approve-scripts ffmpeg-static
      - run: npm run build:dict
      - run: npm run build:assets
      - run: npm run build:sprites
      - run: npm run build:music
      - run: npm run build:fonts
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android

      - name: Target SDK must be 36 (Google Play requirement since 2026-08-31)
        run: |
          grep -q 'targetSdkVersion = 36' android/variables.gradle || {
            echo "targetSdkVersion is not 36"; cat android/variables.gradle; exit 1;
          }

      - name: assembleDebug
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
